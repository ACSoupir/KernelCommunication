# Build the pkgdown site and publish it to GitHub Pages.
#
# The site is built here rather than committed, so generated HTML never lands in the source tree and
# the published site cannot drift from the code it documents. It rebuilds on every push to the default
# branch and on every release.
#
# Deploys to the gh-pages branch. To serve it, set Settings -> Pages -> Source to "Deploy from a
# branch", branch gh-pages, folder / (root). The URL in _pkgdown.yml and DESCRIPTION assumes
# https://acsoupir.github.io/multiScaleAC/.
#
# Pull requests build the site but do not deploy, so a PR that breaks the documentation is caught
# before it is merged.

on:
  push:
    branches: [main, master]
  pull_request:
  release:
    types: [published]
  workflow_dispatch:

name: pkgdown

jobs:
  pkgdown:
    runs-on: ubuntu-latest
    # Only needed for the deploy step; the build itself needs nothing.
    permissions:
      contents: write
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      # Resolves the package's own dependencies plus pkgdown. RcppEigen and the rest come from
      # DESCRIPTION; system libraries for the graphics stack are handled by the action.
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::pkgdown, local::.
          needs: website

      - name: Build site
        run: pkgdown::build_site_github_pages(new_process = FALSE, install = FALSE)
        shell: Rscript {0}

      - name: Deploy to gh-pages
        if: github.event_name != 'pull_request'
        uses: JamesIves/github-pages-deploy-action@v4.5.0
        with:
          clean: false
          branch: gh-pages
          folder: docs
